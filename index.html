<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>learn-dev</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden; font: 14px system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
      button { font: inherit; color: #ddd; background: #333743; border: 1px solid #444; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      button[hidden] { display: none; }
      header { display: flex; gap: 12px; align-items: center; }
      header b { font-size: 16px; }
      #progress { display: flex; gap: 3px; align-items: center; }
      #progress i { width: 14px; height: 6px; border-radius: 3px; background: #3a3e4a; }
      #progress i.done { background: #4cc38a; }
      #progress span { margin-left: 6px; color: #999; font-size: 12px; }
      #lesson { flex: none; max-height: 140px; overflow: auto; padding: 0 12px; border: 1px solid #333; border-radius: 6px; overflow-wrap: anywhere; }
      #lesson h1 { font-size: 16px; margin: 8px 0 0; }
      #lesson code { background: #2d2d2d; padding: 1px 4px; }
      #lesson pre { overflow: auto; }
      #lesson blockquote { color: #999; margin-left: 0; padding-left: 8px; border-left: 3px solid #555; }
      main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0; }
      /* The game is 960×540 and scales to fit the left half, keeping its shape. */
      #stage { container-type: size; display: flex; align-items: center; justify-content: center; background: #111; border-radius: 6px; min-width: 0; }
      #viewport { position: relative; width: min(100cqw, 100cqh * 16 / 9); aspect-ratio: 16 / 9; }
      #game { width: 100%; height: 100%; display: block; background: #000; outline: 2px solid #4af3; outline-offset: -2px; }
      #goals { position: absolute; top: 8px; left: 8px; margin: 0; padding: 6px 10px; list-style: none; background: #000a; border-radius: 6px; pointer-events: none; }
      #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: #000a; font-size: 18px; }
      #overlay[hidden] { display: none; }
      #game:focus { outline: 2px solid #4af; }
      #code { display: grid; grid-template-rows: auto 2fr 1fr; min-width: 0; min-height: 0; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
      #tabs { display: flex; gap: 2px; padding: 4px 6px 0; background: #252526; }
      #tabs span { padding: 4px 10px; border-radius: 6px 6px 0 0; background: #1e1e1e; font-size: 12px; }
      #editor { min-height: 0; }
      #console { min-height: 0; overflow: auto; margin: 0; padding: 4px 8px; border-top: 1px solid #333; font: 12px ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      #console .warn { color: #fc6; }
      #console .error { color: #f66; }
    </style>
  </head>
  <body>
    <header>
      <b>learn-dev</b>
      <div id="progress" aria-label="Course progress"></div>
      <button id="run">▶ Run</button>
      <button id="stop" hidden>■ Stop</button>
      <span id="status" role="status"></span>
    </header>
    <section id="lesson">
      <h1 id="lesson-title"></h1>
      <div id="explanation"></div>
    </section>
    <main>
      <div id="stage">
        <div id="viewport">
          <canvas id="game" width="960" height="540" tabindex="0"></canvas>
          <ul id="goals" aria-label="Goals"></ul>
          <div id="overlay" role="alert" hidden><span id="overlay-text"></span><button id="overlay-run">▶ Run</button></div>
        </div>
      </div>
      <div id="code">
        <div id="tabs" role="tablist"></div>
        <div id="editor"></div>
        <pre id="console" aria-label="Console" aria-live="polite"></pre>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
