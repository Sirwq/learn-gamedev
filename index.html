<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>learn-dev</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
      header { display: flex; gap: 12px; align-items: center; padding: 8px; }
      #lesson { max-height: 30vh; overflow: auto; padding: 0 12px; border-bottom: 1px solid #333; }
      #lesson h1 { font-size: 16px; margin: 8px 0 0; }
      #lesson code { background: #2d2d2d; padding: 1px 4px; }
      #lesson blockquote { color: #999; margin-left: 0; padding-left: 8px; border-left: 3px solid #555; }
      main { flex: 1; display: flex; min-height: 0; }
      #viewport { width: 50%; align-self: flex-start; position: relative; }
      #game { width: 100%; display: block; background: #000; outline-offset: -2px; }
      #goals { position: absolute; top: 8px; left: 8px; margin: 0; padding: 6px 10px; list-style: none; background: #000a; pointer-events: none; }
      #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: #000a; font-size: 18px; }
      #overlay[hidden] { display: none; }
      #game:focus { outline: 2px solid #4af; }
      #editor { flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <button id="run">▶ Run</button>
      <span id="status" role="status"></span>
    </header>
    <section id="lesson">
      <h1 id="lesson-title"></h1>
      <div id="explanation"></div>
    </section>
    <main>
      <div id="viewport">
        <canvas id="game" width="960" height="540" tabindex="0"></canvas>
        <ul id="goals" aria-label="Goals"></ul>
        <div id="overlay" role="alert" hidden><span id="overlay-text"></span><button id="overlay-run">▶ Run</button></div>
      </div>
      <div id="editor"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
